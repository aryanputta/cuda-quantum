name: Repro CUDA-Q issue 4897

on:
  push:
    branches:
      - repro/4897-linux-cudaq
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA-Q
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://pypi.nvidia.com cudaq==0.15.0 numpy

      - name: Reproduce issue 4897
        run: |
          cat > /tmp/repro_4897.py <<'PY'
          import numpy as np
          import cudaq

          print("cudaq version:", getattr(cudaq, "__version__", "unknown"))
          cudaq.set_target("qpp-cpu")

          @cudaq.kernel
          def rotate_each(qubits: cudaq.qview, angles: list[float]):
              index = 0
              for i in range(qubits.size()):
                  ry(angles[index], qubits[i])
                  index += 1

          @cudaq.kernel
          def undo_rotate_each(qubits: cudaq.qview, angles: list[float]):
              index = qubits.size() - 1
              for i in range(qubits.size()):
                  ry(-angles[index], qubits[qubits.size() - 1 - i])
                  index -= 1

          @cudaq.kernel
          def roundtrip_autogen(angles: list[float]):
              qubits = cudaq.qvector(3)
              rotate_each(qubits, angles)
              cudaq.adjoint(rotate_each, qubits, angles)

          @cudaq.kernel
          def roundtrip_manual(angles: list[float]):
              qubits = cudaq.qvector(3)
              rotate_each(qubits, angles)
              undo_rotate_each(qubits, angles)

          angles = [0.3, 0.5, 0.7]
          auto = np.asarray(cudaq.get_state(roundtrip_autogen, angles))
          manual = np.asarray(cudaq.get_state(roundtrip_manual, angles))
          auto_overlap = abs(auto[0])
          manual_overlap = abs(manual[0])
          print(f"cudaq.adjoint roundtrip:  |<000|state>| = {auto_overlap:.16f}")
          print(f"hand-written undo:        |<000|state>| = {manual_overlap:.16f}")

          if not np.isclose(manual_overlap, 1.0, atol=1e-12):
              raise SystemExit("manual adjoint did not produce identity")
          if np.isclose(auto_overlap, 1.0, atol=1e-12):
              raise SystemExit("autogenerated adjoint unexpectedly produced identity")
          print("reproduced issue 4897: autogenerated adjoint is not identity")
          PY
          python /tmp/repro_4897.py
